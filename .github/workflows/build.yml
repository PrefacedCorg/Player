name: build

# 每次 push / PR 只编译和测试，不联网下载 libmpv：
# 7z 包已入库（约 32MB），这里解压取出 libmpv-2.dll 再编译。
# 更新 7z 包走 update-libmpv.yml（手动触发）。

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 从 7z 包解压 libmpv-2.dll
        shell: pwsh
        run: ./scripts/extract-libmpv.ps1

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 还原
        run: dotnet restore Player.slnx

      - name: 编译
        run: dotnet build Player.slnx -c Release --no-restore

      - name: 测试
        run: dotnet test Player.slnx -c Release --no-build
