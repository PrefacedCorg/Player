name: update-libmpv

# 手动触发：拉取 shinchiro/mpv-winbuild-cmake 最新构建的 mpv-dev 7z 包并提交入库。
# 与 build.yml 分开，这样日常 push 不会每回都重新下载几十 MB 的包。
# 用法：Actions → update-libmpv → Run workflow，选好变体即可。

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 构建变体
        required: true
        default: x86_64-v3
        type: choice
        options:
          - x86_64-v3
          - x86_64
          - i686
          - aarch64

jobs:
  update:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载最新 7z 包
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-libmpv.ps1 -Variant "${{ inputs.variant }}" -Force

      - name: 判断是否有变化
        id: diff
        shell: bash
        run: |
          if [ -n "$(git status --porcelain third_party/mpv)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            pkg=$(ls third_party/mpv/mpv-dev-${{ inputs.variant }}-*.7z | head -n 1)
            echo "pkg=$(basename "$pkg")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 收一遍 7z（旧包已被脚本删掉）和 manifest.json（记录文件名与 dll 哈希）
          git add -A third_party/mpv
          git commit -m "chore(libmpv): 更新 ${{ steps.diff.outputs.pkg }}"
          git push
