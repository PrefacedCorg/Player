name: build

# 每次 push / PR：解压入库的 7z 得到 libmpv-2.dll，然后编译、测试、发布。
# 7z 包已入库（约 32MB），dll 不入库，所以这里总是解压一遍。
# 更新 7z 包走 update-libmpv.yml（手动触发）。
# 注：scripts/build.ps1 是给本地用的（它靠 manifest.json 判断要不要重新解压），
#     这里不依赖 manifest，保持流程简单。

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 从 7z 包解压 libmpv-2.dll
        shell: pwsh
        run: ./scripts/extract-libmpv.ps1

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 还原
        run: dotnet restore Player.slnx

      - name: 编译
        run: dotnet build Player.slnx -c Release --no-restore

      - name: 测试
        run: dotnet test Player.slnx -c Release --no-build

      - name: 发布
        run: >
          dotnet publish src/Player.App/Player.App.csproj -c Release -r win-x64
          --self-contained false -p:DebugType=none -o publish/win-x64

      # PR 只验证能否编译，不占 artifact 额度
      - name: 上传产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Player-win-x64
          path: publish/win-x64
          retention-days: 7
